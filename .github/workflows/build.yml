# Triggered by a version tag push. Gated on a TruffleHog secret scan, then
# builds both deployment targets from one pipeline: an on-remote PyInstaller
# archive, and a multi-arch Docker image for the external deployment. See
# references/packaging-and-deployment.md.
name: "Build & Draft Release"

"on":
  push:
    tags:
      - 'v*'

env:
  INTG_NAME: christie-m4k25
  # Python version in the builder image. See
  # https://hub.docker.com/r/unfoldedcircle/r2-pyinstaller for available tags.
  PYTHON_VER: 3.11.12-0.3.0

jobs:
  secrets:
    name: Secret scan
    uses: ./.github/workflows/secret-scan.yml

  build:
    name: Build on-remote archive
    runs-on: ubuntu-24.04
    needs: [secrets]
    outputs:
      version: ${{ steps.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 200

      - name: Get version
        id: get-version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build with the official Remote cross-compile image (aarch64)
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-arm binfmt-support qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          docker run --rm --name builder \
            --platform=aarch64 \
            --user=$(id -u):$(id -g) \
            -v "${GITHUB_WORKSPACE}":/workspace \
            docker.io/unfoldedcircle/r2-pyinstaller:${{ env.PYTHON_VER }} \
            bash -c "cd /workspace && python -m pip install uv && \
              uv export --frozen --no-dev --no-hashes -o requirements.txt && \
              python -m pip install -r requirements.txt && \
              pyinstaller --clean --onedir --name intg-${{ env.INTG_NAME }} \
                --collect-all zeroconf uc_intg_christie_m4k25/driver.py"

      - name: Prepare artifact
        run: |
          mkdir -p artifacts/bin
          mv dist/intg-${{ env.INTG_NAME }}/* artifacts/bin
          mv artifacts/bin/intg-${{ env.INTG_NAME }} artifacts/bin/driver
          cp driver.json artifacts/
          echo "ARTIFACT_NAME=uc-intg-${{ env.INTG_NAME }}-${{ steps.get-version.outputs.VERSION }}-aarch64" >> "$GITHUB_ENV"

      - name: Archive
        run: tar czvf ${{ env.ARTIFACT_NAME }}.tar.gz -C "${GITHUB_WORKSPACE}/artifacts" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  docker:
    name: Build and push external-deployment Docker image
    runs-on: ubuntu-24.04
    needs: [secrets, build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/uc-intg-christie-m4k25
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [secrets, build, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Flatten downloaded artifacts
        run: |
          for d in */; do [ -d "$d" ] && mv "$d"* ./; done
      - name: Hash
        run: sha256sum *.tar.gz > christie-m4k25.hash
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "*.tar.gz,christie-m4k25.hash"
          draft: true
          generateReleaseNotes: true
          artifactErrorsFailBuild: true
          tag: v${{ needs.build.outputs.version }}
