# Standalone example: pulls the published image from GHCR, so this file
# works on its own without a checkout of this repo. Copy it anywhere and run:
#
#   docker compose up -d
#
# To build the image from source instead, use the docker-compose.yml at the
# repo root (docker compose build && docker compose up -d).
services:
  christie-m4k25:
    image: ghcr.io/imsatasia/uc-intg-christie-m4k25:latest
    container_name: uc-intg-christie-m4k25
    restart: unless-stopped
    # Required: mDNS discovery and the Remote's direct WebSocket connection
    # both need to reach the real LAN, not a bridge-NAT'd container IP.
    network_mode: host
    volumes:
      - ./data:/config
    environment:
      - UC_CONFIG_HOME=/config
      - UC_INTEGRATION_INTERFACE=0.0.0.0
      - UC_INTEGRATION_HTTP_PORT=9090
      - UC_DISABLE_MDNS_PUBLISH=false
